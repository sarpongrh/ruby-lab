AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Layout/LineLength:
  Max: 100

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/OneClassPerFile:
  Exclude:
    - ruby-literacy/variable_naming_rules.rb
    - ruby-literacy/define_a_class.rb
    - ruby-literacy/setter_methods.rb
    - ruby-literacy/inheritance.rb

Style/TrivialAccessors:
  Exclude:
    - programs/setter_and_getter.rb
    - ruby-literacy/initialize_obj_with_state.rb
    - ruby-literacy/setter_methods.rb

Style/FormatString:
  Exclude:
    - programs/setter_and_getter.rb
    - ruby-literacy/setter_methods.rb

Naming/AccessorMethodName:
  Exclude:
    - ruby-literacy/instance_var_and_obj_state.rb

Lint/EmptyClass:
  Exclude:
    - ruby-literacy/define_a_class.rb

Style/ClassVars:
  Exclude:
    - ruby-literacy/variable_naming_rules.rb

Style/GlobalVars:
  Exclude:
    - ruby-literacy/variable_naming_rules.rb